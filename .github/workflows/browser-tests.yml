name: Browser regression checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:browser
  voxel-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: voxel-${{ runner.os }}-1.94.0-${{ hashFiles('Cargo.lock') }}
      - run: cargo +1.94.0 test --locked -p crystal-voxel-view --lib
