name: One-time human GLB conversion
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
concurrency:
  group: geothite-pr5-human-glb-conversion
  cancel-in-progress: false
jobs:
  convert:
    if: >-
      github.repository == 'TheCulliganMan/geothite' &&
      github.event.number == 5 &&
      github.event.pull_request.head.repo.full_name == 'TheCulliganMan/geothite' &&
      github.event.pull_request.base.repo.full_name == 'TheCulliganMan/geothite' &&
      github.event.pull_request.head.ref == 'feat/connected-johto-3d' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # Approved one-time conversion; this workflow deletes itself
    env:
      EXPECTED_M: 783464d220f5f34f30c6eda9941fa91d74fadbef
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, same verified official revision as prior conversion
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 3
      - name: Reconstruct the exact reviewed GLB and full source tree
        run: >-
          python3 tools/human-glb-migration/run.py prepare
          --expected-m "$EXPECTED_M" --event "$GITHUB_EVENT_PATH"
          --state "$RUNNER_TEMP/human-glb/state.json"
      - name: Install declared verification dependencies
        run: |
          rustup toolchain install 1.94.0 --profile minimal --target wasm32-unknown-unknown
          python3 -m pip install 'numpy>=1.24,<3'
      - name: Validate canonical assets and animation contracts
        run: |
          python3 tools/check-johto-models.py
          python3 tools/check-johto-characters.py
          python3 tools/check-room-furniture-bindings.py
          python3 tools/check-facility-table-rigs.py
          python3 tools/check-interior-models.py
          python3 tools/check-dungeon-models.py
          python3 tools/check-special-environments.py
          python3 tools/check-special-rooms.py
          python3 tools/check-gate-counter-models.py
          python3 tools/check-cable-club.py
          python3 tools/check-cable-backwalls.py
          python3 tools/check-gym-scenery-models.py
          python3 tools/check-department-store.py
          python3 tools/check-outdoor-sign-frames.py
          python3 tools/check-lighthouse-masonry.py
          python3 tools/check-lighthouse-chamber.py
          python3 tools/check-facility-radio.py
          python3 tools/check-facility-tables.py
          python3 tools/check-ship-rooms.py
          python3 tools/check-ship-fronts.py
          python3 tools/check-traditional-room-models.py
          python3 tools/check-train-station-models.py
          python3 tools/check-park-scenery-models.py
          python3 tools/check-structure-extensions.py
          python3 tools/check-actor-props.py
          python3 tools/check-battle-species.py
          python3 tools/validate-battle-art.py
          python3 tools/test_johto_character_geometry.py
          python3 tools/test_animated_glb.py
          python3 tools/human_locomotion.py
          python3 tools/test_model_asset_storage.py
          python3 tools/test_johto_art_sources.py
          python3 tools/test_asset_storage_migration.py
          python3 tools/test_export_model_stl.py
          python3 tools/check-model-layout.py
      - name: Verify native regressions and full browser build
        run: |
          cargo +1.94.0 test --locked -p crystal-voxel-view --lib
          cargo +1.94.0 check --locked -p crystal-bevy --bin crystal-bevy --features fullscreen-scaling,voxel-view,location-tester --target wasm32-unknown-unknown
          git rev-parse HEAD > "$RUNNER_TEMP/human-glb/validated-head"
      - name: Remove temporary files and publish the exact reviewed tree
        run: >-
          python3 tools/human-glb-migration/run.py finish
          --expected-m "$EXPECTED_M" --event "$GITHUB_EVENT_PATH"
          --state "$RUNNER_TEMP/human-glb/state.json"
          --validation-stamp "$RUNNER_TEMP/human-glb/validated-head" --publish
