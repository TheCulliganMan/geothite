[package]
name = "crystal-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bincode.workspace = true
crc32fast = { version = "1", optional = true }
crystal-core.workspace = true
ewebsock = { version = "0.8", features = ["tls"] }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
uuid = { workspace = true, features = ["js", "serde", "v4"] }
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
meshtastic = { version = "0.1.9", optional = true, features = ["bluetooth-le"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "sync", "time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true, optional = true }
meshtastic = { version = "0.1.9", optional = true, default-features = false }
wasm-bindgen = { workspace = true, optional = true }

[features]
default = []
meshtastic = ["dep:crc32fast", "dep:sha2", "dep:meshtastic", "dep:tokio", "dep:js-sys", "dep:wasm-bindgen"]
meshtastic-protocol = ["dep:crc32fast", "dep:sha2"]

[dev-dependencies]
crystal-core = { workspace = true, features = ["test-fixtures"] }
serde_json.workspace = true
