[package]
name = "crystal-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-fixtures = ["crystal-assets/test-fixtures", "crystal-core/test-fixtures"]
location-tester = ["crystal-assets/test-fixtures"]
operation-trace = ["dep:tracing"]

[dependencies]
anyhow.workspace = true
crystal-assets = { path = "../crystal-assets" }
crystal-audio = { path = "../crystal-audio" }
crystal-core = { path = "../crystal-core" }
crystal-net = { path = "../crystal-net" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true
tracing = { version = "0.1", optional = true }

[dev-dependencies]
crystal-assets = { path = "../crystal-assets", features = ["test-fixtures"] }
crystal-core = { path = "../crystal-core", features = ["test-fixtures"] }
sha2.workspace = true
