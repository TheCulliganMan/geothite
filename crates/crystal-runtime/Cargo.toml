[package]
name = "crystal-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-fixtures = ["crystal-assets/test-fixtures", "crystal-core/test-fixtures"]
location-tester = ["crystal-assets/test-fixtures"]
operation-trace = ["dep:tracing"]

[dependencies]
anyhow.workspace = true
crystal-assets.workspace = true
crystal-audio.workspace = true
crystal-core.workspace = true
crystal-net.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = { version = "0.1", optional = true }

[dev-dependencies]
crystal-assets = { workspace = true, features = ["test-fixtures"] }
crystal-core = { workspace = true, features = ["test-fixtures"] }
sha2.workspace = true
