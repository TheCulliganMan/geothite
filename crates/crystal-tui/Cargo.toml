[package]
name = "geothite"
version = "0.1.0"
description = "Shared native and browser WASM terminal frontend for Geothite"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
crystal-assets = { path = "../crystal-assets" }
crystal-bevy = { path = "../crystal-bevy" }
crystal-core = { path = "../crystal-core" }
crystal-runtime = { path = "../crystal-runtime" }
ratatui = { version = "0.30", default-features = false }
serde.workspace = true
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
# Boa exposes its global opcode budget under `fuzz`; loop limits alone do not
# stop nested loops or endless Promise jobs. Pin the API on both platforms.
boa_engine = { version = "=0.22.0", default-features = false, features = ["fuzz"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
libc = "0.2"
# Use the portable tty poller: macOS kqueue rejects a terminal reopened after
# curl's piped stdin, even though isatty and rendering both succeed.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "=0.22.0", default-features = false, features = ["fuzz", "js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[dev-dependencies]
crystal-runtime = { path = "../crystal-runtime", features = ["test-fixtures"] }
