[package]
name = "crystal-voxel-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_log",
    "bevy_shader",
    "bevy_material",
    "bevy_anti_alias",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "multi_threaded",
] }
crystal-render-api.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
base64.workspace = true
flate2.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
sha2.workspace = true
image = { workspace = true, features = ["jpeg"] }

[features]
people-review = ["bevy/bevy_winit", "bevy/x11", "bevy/png"]
operation-trace = []

[build-dependencies]
flate2.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
crystal-assets.workspace = true

[[bin]]
name = "render_people_review"
path = "src/bin/render_people_review.rs"
required-features = ["people-review"]
