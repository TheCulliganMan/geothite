[package]
name = "crystal-voxel-view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_light",
    "bevy_log",
    "bevy_shader",
    "bevy_material",
    "bevy_anti_alias",
    "smaa_luts",
    "zstd_rust",
    "bevy_post_process",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "default_font",
    "multi_threaded",
] }
crystal-render-api.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
base64.workspace = true
flate2.workspace = true
gltf = { version = "1.4.1", default-features = false, features = ["utils", "names", "extras"] }
sha2.workspace = true
image = { workspace = true, features = ["jpeg"] }
ciborium = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["extern_crate_alloc"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }

[features]
# Main-renderer QA bridge; the isolated CPU worker does not include this.
terrain-worker-browser = ["terrain-worker", "dep:wasm-bindgen", "dep:js-sys"]
terrain-worker = ["dep:ciborium", "dep:bytemuck"]
actor-worker = ["terrain-worker"]
actor-worker-browser = ["actor-worker", "dep:wasm-bindgen", "dep:js-sys"]
people-review = ["bevy/bevy_winit", "bevy/x11", "bevy/png"]
operation-trace = []
# Exact full-detail browser/native comparisons without a runtime environment.
scenery-full-detail = []

[build-dependencies]
flate2.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
crystal-assets.workspace = true

[[bin]]
name = "render_people_review"
path = "src/bin/render_people_review.rs"
required-features = ["people-review"]
